name: EasyDubber Auto Production

on:
  workflow_dispatch:

jobs:
  produce:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers soundfile firebase-admin pillow
          pip install google-auth google-auth-oauthlib google-api-python-client google-auth-httplib2

      - name: Generate Story
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/generate_episode.py

      - name: Create Scene Images
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/create_all_scene_images.py

      - name: Create Cinematic Video
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/make_visual_narrated_video.py

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: easydubber-final-video
          path: output/easydubber_visual_tagalog_episode.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/upload_youtube.py

      - name: Upload Scene Images
        uses: actions/upload-artifact@v4
        with:
          name: easydubber-scene-images
          path: output/images/*.png
