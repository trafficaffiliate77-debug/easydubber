name: EasyDubber Cinematic Tagalog Episode

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers soundfile firebase-admin pillow

      - name: Create scene visuals
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/create_all_scene_images.py

      - name: Create cinematic Tagalog video
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/make_visual_narrated_video.py

      - name: Save final video
        uses: actions/upload-artifact@v4
        with:
          name: easydubber-cinematic-tagalog
          path: output/easydubber_visual_tagalog_episode.mp4
