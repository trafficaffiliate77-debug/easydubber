name: EasyDubber Tagalog TTS Test

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers soundfile

      - name: Generate Tagalog voice
        run: |
          python scripts/test_tts.py

      - name: Save audio
        uses: actions/upload-artifact@v4
        with:
          name: tagalog-voice-test
          path: tagalog_test.wav
