name: EasyDubber Video Test

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render video
        run: |
          python scripts/render_video.py

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: easydubber-video
          path: output/easydubber_test.mp4
