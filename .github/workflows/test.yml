name: EasyDubber Tagalog Episode

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers soundfile firebase-admin pillow

      - name: Test visual generator
        run: |
          python scripts/create_scene_image.py
    
      - name: Create Tagalog episode
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/make_narrated_video.py

      - name: Save finished video
        uses: actions/upload-artifact@v4
        with:
          name: easydubber-tagalog-episode
          path: output/easydubber_tagalog_episode.mp4
